name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/evaluator.test.js tests/persistence.test.js tests/content.test.js
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_ui.py
      - run: python tests/test_v03_browser.py
      - run: python tests/test_unit3_browser.py
      - run: python tests/test_unit4_browser.py
      - run: python tests/test_browser_storage_shim.py
      - run: python tests/test_audio_lifecycle.py
      - run: python tests/test_accessibility_primitives.py
      - run: python tests/test_persistence_http.py
      - run: python tests/test_quality.py
      - run: python tests/test_diagnostics.py
      - run: python tests/test_diagnostics_browser.py
